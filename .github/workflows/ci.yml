name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

      - name: Smoke check app creation
        run: |
          python - <<'PY'
          from apps.platform_api.main import create_app

          app = create_app()
          openapi_paths = app.openapi().get("paths", {})
          workflow_routes = sorted(
              path
              for path in openapi_paths
              if path.startswith("/v1/platform/workflows")
          )
          assert workflow_routes, "expected workflow routes to be registered"
          print("app-created", len(app.routes))
          print("workflow-routes", len(workflow_routes))
          PY
