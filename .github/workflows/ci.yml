name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowbiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/flowbiz_test
      TEST_DATABASE_LIBPQ_URL: postgresql://postgres:postgres@localhost:5432/flowbiz_test
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run Alembic upgrade
        run: alembic upgrade head

      - name: Run pytest
        run: pytest -q

      - name: Rehearse downgrade and upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Rehearse pg_dump and pg_restore
        run: |
          pg_dump "$TEST_DATABASE_LIBPQ_URL" --format=custom --file=/tmp/flowbiz-platform.dump
          createdb --host=localhost --username=postgres flowbiz_restore
          pg_restore --dbname=postgresql://postgres:postgres@localhost:5432/flowbiz_restore /tmp/flowbiz-platform.dump
          dropdb --host=localhost --username=postgres flowbiz_restore

      - name: Smoke check app creation
        run: |
          python - <<'PY'
          from apps.platform_api.main import create_app

          app = create_app()
          openapi_paths = app.openapi().get("paths", {})
          workflow_routes = sorted(
              path
              for path in openapi_paths
              if path.startswith("/v1/platform/workflows")
          )
          assert workflow_routes, "expected workflow routes to be registered"
          print("app-created", len(app.routes))
          print("workflow-routes", len(workflow_routes))
          PY
