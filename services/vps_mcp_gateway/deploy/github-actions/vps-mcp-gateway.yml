name: VPS MCP Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - "services/vps_mcp_gateway/**"
      - ".github/workflows/vps-mcp-gateway.yml"
  pull_request:
    paths:
      - "services/vps_mcp_gateway/**"
      - ".github/workflows/vps-mcp-gateway.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vps_mcp_gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vps_mcp_gateway/pyproject.toml

      - name: Install gateway and validation dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate gateway
        run: bash scripts/validate.sh
